name: quality

"on":
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run_ci: ${{ steps.classify.outputs.run_ci }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: classify
        name: Classify changed paths
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: python3 scripts/ci-changes.py

  backend-race:
    needs: changes
    if: needs.changes.outputs.run_ci == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: artex_ci
          POSTGRES_PASSWORD: fixture_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U artex_ci -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ARTEX_CONFIG: /dev/null
      ARTEX_REVIEW_LIVE_CONFIG: ""
      ARTEX_NOTES_TEST_ADMIN_DSN: "postgres://artex_ci:fixture_only@127.0.0.1:5432/postgres?sslmode=disable"
      ARTEX_CALENDAR_TEST_ADMIN_DSN: "postgres://artex_ci:fixture_only@127.0.0.1:5432/postgres?sslmode=disable"
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      ARTEX_LLM_PROVIDER: ""
      ARTEX_LLM_BASE_URL: ""
      ARTEX_LLM_MODEL: ""
      ARTEX_LLM_PROXY: ""
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
            third_party/go-mitmproxy/go.mod
            third_party/go-mitmproxy/go.sum
            third_party/norma/go.mod
            third_party/norma/go.sum
            scripts/ci-backend.py
      - name: Race tests with a fresh database for each package
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci-backend.py --shard "${{ matrix.shard }}"

  backend-tools:
    needs: changes
    if: needs.changes.outputs.run_ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            third_party/go-mitmproxy/go.mod
            third_party/go-mitmproxy/go.sum
            third_party/norma/go.mod
            third_party/norma/go.sum
      - name: Patched proxy dependency regression tests
        working-directory: third_party/go-mitmproxy
        run: go test -race -count=1 ./internal/helper
      - name: Patched Norma dependency regression tests
        working-directory: third_party/norma
        run: go test -race -count=1 ./...
      - name: Static harvest regression tests
        run: python3 -m unittest discover -s skills/api-recon/scripts -p 'test_harvest_static.py'
      - name: CI helper regression tests
        env:
          ARTEX_CI_TEST_TMP: ${{ runner.temp }}
        run: python3 -m unittest scripts/test_ci_helpers.py

  quality:
    if: always()
    needs: [changes, backend-race, backend-tools, frontend, native, image, security]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce quality result
        env:
          RUN_CI: ${{ needs.changes.outputs.run_ci }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          BACKEND_RESULT: ${{ needs.backend-race.result }}
          TOOLS_RESULT: ${{ needs.backend-tools.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          IMAGE_RESULT: ${{ needs.image.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: |
          set -euo pipefail
          test "$CHANGES_RESULT" = success
          if [ "$RUN_CI" = true ]; then
            for result in "$BACKEND_RESULT" "$TOOLS_RESULT" "$FRONTEND_RESULT" "$NATIVE_RESULT" "$IMAGE_RESULT" "$SECURITY_RESULT"; do
              test "$result" = success
            done
          elif [ "$RUN_CI" = false ]; then
            for result in "$BACKEND_RESULT" "$TOOLS_RESULT" "$FRONTEND_RESULT" "$NATIVE_RESULT" "$IMAGE_RESULT" "$SECURITY_RESULT"; do
              test "$result" = skipped
            done
          else
            echo "unexpected RUN_CI=$RUN_CI" >&2
            exit 1
          fi

  frontend:
    needs: changes
    if: needs.changes.outputs.run_ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Restore frontend compiler caches
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            web/.next/cache
            web/tsconfig.tsbuildinfo
          key: ${{ runner.os }}-${{ runner.arch }}-node22-next-mock-${{ hashFiles('web/package-lock.json', 'web/next.config.*', 'web/tsconfig.json') }}-${{ hashFiles('web/src/**', 'web/public/**', 'web/scripts/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-node22-next-mock-${{ hashFiles('web/package-lock.json', 'web/next.config.*', 'web/tsconfig.json') }}-
      - run: node --test src/lib/*.test.mjs
      - run: npx --no-install tsc --noEmit
      - name: Check UI translation dictionary coverage
        run: node scripts/i18n-audit.mjs
      - name: Build static mock UI
        env:
          NEXT_EXPORT: "1"
          NEXT_PUBLIC_MOCK: "1"
        run: npm run build
      - run: npm audit --audit-level=high
      - name: Upload CI-only static mock UI for image checks
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-only-mock-ui
          path: web/out
          retention-days: 1
          if-no-files-found: error

  native:
    needs: frontend
    uses: ./.github/workflows/native-packages.yml
    with:
      frontend-artifact: ci-only-mock-ui
      version: 0.0.1
      artifact-prefix: ci-native

  image:
    needs: [changes, frontend]
    if: needs.changes.outputs.run_ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ci-only-mock-ui
          path: server/webui/dist
      - name: Build embedded Linux CLI
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p "$RUNNER_TEMP/image-context/dist/amd64"
          go build -tags embedui -o "$RUNNER_TEMP/image-context/dist/amd64/artex" ./cmd/artex
      - name: Prepare isolated context with synthetic private-file canaries
        run: |
          git archive HEAD | tar -x -C "$RUNNER_TEMP/image-context"
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import secrets

          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          context = root / "image-context"
          canaries = []
          for prefix in ("", "skills/ci-private-fixtures/"):
              for name in (".env", "config.json", "jwt.key", "setup.token", ".auth-private-fixture", "data/private", "sessions/private", ".cache/private"):
                  path = context / (prefix + name)
                  path.parent.mkdir(parents=True, exist_ok=True)
                  value = "ARTEX_CI_CANARY_" + secrets.token_hex(24)
                  with path.open("x") as fixture:
                      fixture.write(value)
                  canaries.append(value)
          (root / "image-canaries.json").write_text(json.dumps(canaries))
          PY
      - name: Build runtime image without publishing
        run: docker build --build-arg TARGETARCH=amd64 --label artex.ci-only.mock-ui=true -t artex:ci-only "$RUNNER_TEMP/image-context"
      - name: Check startup and pinned browser tool provisioning
        run: |
          docker run --rm --network none --entrypoint /app/artex artex:ci-only -h
          docker run --rm --network none --entrypoint sh artex:ci-only -ec 'test -s /app/LICENSE; test -s /app/THIRD-PARTY-NOTICES.txt'
          docker run --rm --network none --entrypoint sh artex:ci-only -ec '
            playwright-cli --help > /dev/null
            playwright-mcp --help > /dev/null
            playwright --version
            playwright install --dry-run chromium
            test -d /root/.cache/ms-playwright
            find /root/.cache/ms-playwright -type f -name chrome -print -quit | grep -q .
            npm list -g --depth=0 @playwright/mcp @playwright/cli playwright
          '
          docker run --rm -i --network none --entrypoint node artex:ci-only <<'JS'
          const fs = require("node:fs");
          const path = require("node:path");
          const { createRequire } = require("node:module");
          const { execFileSync } = require("node:child_process");
          const root = execFileSync("npm", ["root", "-g"], { encoding: "utf8" }).trim();
          for (const name of ["playwright", "@playwright/mcp", "@playwright/cli"]) {
            const packageRoot = path.join(root, name);
            const packageRequire = createRequire(path.join(packageRoot, "package.json"));
            const playwright = name === "playwright" ? require(packageRoot) : packageRequire("playwright");
            const executable = playwright.chromium.executablePath();
            if (!fs.existsSync(executable) || !fs.statSync(executable).isFile()) {
              throw new Error(`Chromium executable is missing for ${name}: ${executable}`);
            }
            console.log(`Chromium executable provisioned for ${name}.`);
          }
          JS
      - name: Verify every image layer excludes private-file canaries
        run: |
          python3 scripts/check-image-layers.py --self-test
          docker save artex:ci-only -o "$RUNNER_TEMP/image.tar"
          python3 scripts/check-image-layers.py "$RUNNER_TEMP/image.tar" --canaries "$RUNNER_TEMP/image-canaries.json"

  security:
    needs: changes
    if: needs.changes.outputs.run_ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: skills/api-recon/scripts/package-lock.json
      - name: Check recon dependencies
        run: |
          npm ci --ignore-scripts --prefix skills/api-recon/scripts
          npm audit --audit-level=high --prefix skills/api-recon/scripts
      - name: Runtime harvest transport regression tests
        run: npm test --prefix skills/api-recon/scripts
      - name: Check installer and release helpers
        run: |
          python3 scripts/install_test.py
          python3 -m unittest discover -s scripts -p 'test_release*.py'
          python3 -m unittest discover -s scripts -p 'test_native*.py'
      - name: Check publication inputs
        run: python3 scripts/check-publication-inputs.py
      - name: Install verified Gitleaks 8.30.1
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check
          mkdir "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
      - name: Scan current tracked files and full HEAD history
        shell: bash
        run: |
          set -euo pipefail
          current="$RUNNER_TEMP/publication-inputs"
          mkdir "$current"
          git archive HEAD | tar -x -C "$current"
          result=0
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" dir "$current" --redact=100 --no-banner || result=1
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" git . --log-opts=HEAD --redact=100 --no-banner || result=1
          exit "$result"
