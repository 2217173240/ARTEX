name: release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的正式版本标签，例如 v0.3.15"
        required: true
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: read

# Retried tag builds can restore trusted caches, but cannot overwrite main caches.
cache-mode: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    outputs:
      tag: ${{ steps.preflight.outputs.tag }}
      commit: ${{ steps.preflight.outputs.commit }}
      image: ${{ steps.preflight.outputs.image }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Pin actual tag commit and require exact quality evidence
        id: preflight
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/release-preflight.py
      - id: version
        env:
          TAG: ${{ steps.preflight.outputs.tag }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  # ① 前端静态导出（一次），产物给交叉编译各平台复用
  frontend:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build:static
        working-directory: web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: web-dist
          path: web/out
          if-no-files-found: error

  # ② 五平台交叉编译（内嵌前端）+ 打 zip
  binaries:
    needs: [prepare, frontend]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: web-dist
          path: server/webui/dist
      - name: Build and package with build.sh
        env:
          ARTEX_TARGET_OS: ${{ matrix.goos }}
          ARTEX_TARGET_ARCH: ${{ matrix.goarch }}
          ARTEX_BUILD_VERSION: ${{ needs.prepare.outputs.tag }}
          ARTEX_SKIP_FRONTEND: "1"
          ARTEX_SKIP_NPM_CI: "1"
          # UPX 自解压 ELF 在部分 Linux 内核、虚拟化和安全策略下会崩溃。
          # Release 使用 Go linker 裁剪和 zip 压缩，优先保证可移植性。
          ARTEX_COMPRESS: "0"
          ARTEX_PACKAGE: "1"
          ARTEX_PACKAGE_DIR: dist
        run: |
          ./build.sh --target "${ARTEX_TARGET_OS}/${ARTEX_TARGET_ARCH}"
      - name: Add portable Linux tarball from the portable ZIP
        if: matrix.goos == 'linux'
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          ARCH: ${{ matrix.goarch }}
        run: python3 scripts/package-portable-tar.py "dist/artex-${TAG#v}-linux-$ARCH.zip" "dist/artex-${TAG#v}-linux-$ARCH.tar.gz"
      - name: Smoke test Linux amd64 binary
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: dist/artex-linux-amd64/artex -h
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pkg-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
      # Linux 生二进制单独上传，供 docker job 复用（免在镜像里重编前端+Go）
      - if: matrix.goos == 'linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bin-linux-${{ matrix.goarch }}
          path: dist/artex-linux-${{ matrix.goarch }}/artex
          if-no-files-found: error

  native:
    needs: [prepare, frontend]
    uses: ./.github/workflows/native-packages.yml
    with:
      frontend-artifact: web-dist
      ref: ${{ needs.prepare.outputs.commit }}
      version: ${{ needs.prepare.outputs.version }}
      artifact-prefix: pkg-native

  # ③ 汇总所有 zip → 创建 GitHub Release
  release-draft:
    needs: [prepare, binaries, native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: pkg-*
          merge-multiple: true
          path: dist
      - name: Require all 16 assets and generate complete checksums
        run: python3 scripts/check-release-assets.py --version "${RELEASE_TAG#v}" --directory dist --write-checksums
      - name: Refuse to overwrite a published release
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > /tmp/artex-release.json 2>/tmp/artex-release.err; then
            test "$(jq -r .isDraft /tmp/artex-release.json)" = true || {
              echo "该版本已发布，请使用新的版本标签" >&2
              exit 1
            }
          elif ! grep -qi 'release not found\|HTTP 404' /tmp/artex-release.err; then
            cat /tmp/artex-release.err >&2
            exit 1
          fi
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.commit }}
          draft: true
          fail_on_unmatched_files: true
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.msi
            dist/*.pkg
            dist/*.deb
            dist/*.rpm
            dist/SHA256SUMS
          generate_release_notes: true
          body: |
            GHCR 镜像：`${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.tag }}`，同时提供 `latest`。
            支持 Linux AMD64 / ARM64，Docker 会自动选择宿主机架构。
            提供 Linux、macOS、Windows AMD64 / ARM64 便携 ZIP，以及 Linux TAR.GZ、DEB、RPM、Windows MSI、macOS PKG，并附 SHA256SUMS。
            MSI 和 PKG 当前未签名；macOS 可能需要在系统设置中允许打开。首次启动连接已有 PostgreSQL 数据库，安装不会调用模型服务。
            部署和在线更新说明见本仓库 README。
  # ④ 在原生 AMD64 / ARM64 runner 上构建和测试，再推送架构镜像。
  docker:
    needs: [prepare, binaries, release-draft]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: artex
          POSTGRES_PASSWORD: artex-ci-test
          POSTGRES_DB: artex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U artex -d artex"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # 取 Dockerfile 与 skills/
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: bin-linux-${{ matrix.arch }}
          path: dist/${{ matrix.arch }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build image for native smoke test
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          provenance: false
          tags: artex:smoke
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.tag }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.commit }}
            org.opencontainers.image.licenses=AGPL-3.0
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
      - name: Test application startup and embedded frontend
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /app/artex artex:smoke -h
          docker run -d --name artex-smoke --network host \
            -e ARTEX_CONFIG=/dev/null \
            -e ARTEX_PG_DSN='postgres://artex:artex-ci-test@127.0.0.1:5432/artex?sslmode=disable' artex:smoke
          trap 'docker logs artex-smoke; docker rm -f artex-smoke' EXIT
          curl --fail --retry 30 --retry-connrefused --retry-delay 2 --max-time 3 \
            http://127.0.0.1:8787/api/health > /tmp/artex-health.json
          jq -e --arg version "${RELEASE_TAG#v}" '.ok == true and .version == $version' /tmp/artex-health.json
          curl --fail http://127.0.0.1:8787/ > /tmp/artex-index.html
          grep -qi '<!doctype html' /tmp/artex-index.html
      - name: Push the exact locally tested image
        id: push
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          STAGE: stage-${{ needs.prepare.outputs.commit }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
        run: |
          set -euo pipefail
          docker tag artex:smoke "$IMAGE:$STAGE"
          docker push "$IMAGE:$STAGE"
          digest=$(docker inspect "$IMAGE:$STAGE" --format '{{index .RepoDigests 0}}')
          printf 'digest=%s\n' "${digest#*@}" >> "$GITHUB_OUTPUT"

      - name: Record tested architecture digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p digests
          printf '%s\n' "$DIGEST" > "digests/$ARCH"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error

  publish:
    needs: [prepare, docker, release-draft]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      IMAGE: ${{ needs.prepare.outputs.image }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      STAGE: stage-${{ needs.prepare.outputs.commit }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Aggregate and verify both tested architectures before public tags
        run: |
          set -euo pipefail
          amd64=$(cat digests/amd64)
          arm64=$(cat digests/arm64)
          [[ "$amd64" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$arm64" =~ ^sha256:[a-f0-9]{64}$ ]]
          docker buildx imagetools create --tag "$IMAGE:$STAGE" "$IMAGE@$amd64" "$IMAGE@$arm64"
          docker buildx imagetools inspect "$IMAGE:$STAGE" --raw > manifest.json
          jq -e --arg amd64 "$amd64" --arg arm64 "$arm64" '
            (.manifests | length) == 2 and
            ([.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64" and .digest == $amd64)] | length) == 1 and
            ([.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64" and .digest == $arm64)] | length) == 1' manifest.json
          # Recheck the draft immediately before any public version/latest mutation.
          gh release view "$RELEASE_TAG" --json isDraft,assets > release-assets.json
          python3 scripts/check-release-assets.py --version "${RELEASE_TAG#v}" --release-json release-assets.json
          gh release download "$RELEASE_TAG" --dir verified-assets
          python3 scripts/check-release-assets.py --version "${RELEASE_TAG#v}" --directory verified-assets
          docker buildx imagetools create --tag "$IMAGE:$RELEASE_TAG" --tag "$IMAGE:latest" "$IMAGE:$STAGE"
          docker buildx imagetools inspect "$IMAGE:$RELEASE_TAG" --format '{{json .Manifest}}' > image-manifest.json
          digest=$(jq -er '.digest | select(test("^sha256:[a-f0-9]{64}$"))' image-manifest.json)
          printf '%s@%s\n' "$IMAGE" "$digest" > IMAGE_DIGEST
          gh release upload "$RELEASE_TAG" IMAGE_DIGEST --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
          printf 'Image: `%s@%s`\n\nFirst GHCR publication defaults to private. Set package visibility to public, then verify anonymous pulls of both platforms.\n' "$IMAGE" "$digest" >> "$GITHUB_STEP_SUMMARY"
